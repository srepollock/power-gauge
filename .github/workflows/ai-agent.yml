# Consumer workflow for srepollock/ci-toolkit ai-agent.yml
# The @claude mention and OWNER/MEMBER/COLLABORATOR gate live in the reusable.
name: ai-agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: ai-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agent:
    uses: srepollock/ci-toolkit/.github/workflows/ai-agent.yml@v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    with:
      # .nvmrc + package-lock.json → npm ci. The agent runs on ubuntu-latest,
      # so it can typecheck, test and build the frontend but not the Tauri Rust side.
      setup: node
      # The action's default tool set has no Bash, so without these the agent can't run the checks.
      allowed_tools: "Read,Edit,Write,Glob,Grep,LS,Bash(npm ci),Bash(npm run typecheck),Bash(npm test),Bash(npm run build)"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
