# Release pipeline:
# 1. release-please manages Release PRs on trunk/main and updates package.json,
#    src-tauri/tauri.conf.json, src-tauri/Cargo.toml, and CHANGELOG.md.
# 2. When release_created == 'true' (or on manual workflow_dispatch),
#    build-windows-release compiles the Tauri Windows installers & portable exe
#    and uploads them to the GitHub Release.
# 3. To (re)build an existing release, dispatch with `tag` (e.g. v0.2.0): the
#    tag's source is built and its assets are attached to that release.
name: release

on:
  push:
    branches: [trunk, main]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build Windows release artifacts even without a new release-please tag"
        type: boolean
        default: true
      tag:
        description: "Existing release tag to build and attach assets to (e.g. v0.2.0). Empty = build the dispatched ref without attaching."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-windows-release:
    name: Build Windows Installers (.exe, .msi, Portable & SHA256SUMS)
    needs: [release-please]
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.force_build == true))
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref }}

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Cargo Registry & Target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # One command per step: a multi-line pwsh step only fails on the last
      # command's exit code.
      - name: Run Frontend Unit Tests
        run: npm test

      # tauri::generate_context!() embeds ../dist at compile time, so the
      # frontend bundle must exist before any cargo build or test.
      - name: Build Production Frontend Bundle (dist/)
        run: npm run build

      - name: Run Rust Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri Release & Windows Installers
        shell: pwsh
        run: ./scripts/build-release.ps1 -BundleInstallers

      - name: Upload Release Artifacts to Workflow Run
        uses: actions/upload-artifact@v7
        with:
          name: PowerGauge-HUD-Windows-Release
          path: release/v*/*

      - name: Attach Artifacts to GitHub Release
        if: needs.release-please.outputs.release_created == 'true' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        shell: pwsh
        run: |
          # build-release.ps1 stages into release/v<package.json version>, so this
          # also fails if the tag doesn't match the version that was built.
          $dir = Join-Path "release" $env:RELEASE_TAG
          if (-not (Test-Path $dir)) { throw "No staged artifacts in $dir for tag $env:RELEASE_TAG" }
          # Native commands don't expand globs in pwsh; pass explicit paths.
          $files = @(Get-ChildItem -Path $dir -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "No files to upload in $dir" }
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
