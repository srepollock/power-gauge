# Consumer workflow for srepollock/ci-toolkit ai-triage.yml
name: ai-triage

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  triage:
    uses: srepollock/ci-toolkit/.github/workflows/ai-triage.yml@v0
    permissions:
      contents: read
      issues: write
      id-token: write
    with:
      provider: claude
      max_turns: 15
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
