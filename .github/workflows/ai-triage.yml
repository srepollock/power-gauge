# Caller for the vendored ci-toolkit reusable (reusable-ai-triage.yml).
name: ai-triage

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  triage:
    uses: ./.github/workflows/reusable-ai-triage.yml
    permissions:
      contents: read
      issues: write
      id-token: write
    with:
      provider: claude
      max_turns: 15
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
