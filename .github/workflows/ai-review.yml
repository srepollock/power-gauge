# Caller for the vendored ci-toolkit reusable (reusable-ai-review.yml).
name: ai-review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize, labeled]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review:
    uses: ./.github/workflows/reusable-ai-review.yml
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    with:
      provider: claude
      review_gate: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
