# Consumer workflow for srepollock/ci-toolkit ai-review.yml
name: ai-review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize, labeled]

permissions:
  contents: read

jobs:
  review:
    uses: srepollock/ci-toolkit/.github/workflows/ai-review.yml@v0
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    with:
      provider: claude
      review_gate: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
